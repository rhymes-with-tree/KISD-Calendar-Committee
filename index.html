<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendar Committee Planner</title>
<style>
:root{
  --ink:#12161c;--ink-soft:#4a5462;--rule:#0f1218;--paper:#fff;--slate:#e9ecf1;
  --navy:#1b2a44;--navy-2:#24365a;--work:#a8bedd;--off:#fff34d;--off-soft:#fff9b8;
  --blank:#d3d6db;--flag:#b3261e;--ok:#1c6b3c;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--slate);color:var(--ink);font-size:15px;line-height:1.45;
 font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid #2f6df6;outline-offset:2px}

.chrome{position:sticky;top:0;z-index:40;background:var(--navy);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.chrome-in{max-width:1500px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{margin:0;font-size:16px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.brand .yr{font-size:14px;color:#a9bcd8}
.ystep{display:flex;align-items:stretch;background:var(--navy-2);border:1px solid #43587e;border-radius:5px;overflow:hidden}
.ystep button{background:none;border:0;color:#a9bcd8;padding:0 9px;font-size:13px}
.ystep button:hover{background:#31477a;color:#fff}
.ystep input{width:62px;background:none;border:0;border-left:1px solid #43587e;border-right:1px solid #43587e;color:#fff;font:inherit;font-size:14px;font-variant-numeric:tabular-nums;text-align:right;padding:5px 0 5px 6px;-moz-appearance:textfield}
.ystep input::-webkit-outer-spin-button,.ystep input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.ystep .end{color:#a9bcd8;font-size:14px;padding:5px 8px 5px 2px;align-self:center}
.btn{background:var(--navy-2);border:1px solid #43587e;color:#fff;border-radius:5px;padding:7px 13px;font-size:14px;white-space:nowrap}
.btn:hover{background:#31477a}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:#f2f5fa;color:var(--navy);border-color:#f2f5fa;font-weight:600}
.btn.primary:hover{background:#fff}

.wrap{max-width:1500px;margin:0 auto;padding:16px}
.status{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.msg{display:flex;gap:10px;align-items:flex-start;padding:9px 13px;border:1px solid #c9cfd8;border-left-width:5px;border-radius:5px;font-size:14.5px;background:#fafbfc;max-width:1100px}
.msg .ic{font-weight:800;flex:none;width:14px;text-align:center}
.msg.ok{border-left-color:var(--ok);color:#14502c;background:#f3faf5}
.msg.bad{border-left-color:var(--flag);color:#7d1b15;background:#fdf4f3}
.msg b{font-variant-numeric:tabular-nums}
.msg .go{margin-left:auto;border:1px solid currentColor;background:transparent;border-radius:4px;padding:1px 9px;font-size:12.5px;opacity:.7;white-space:nowrap}
.msg .go:hover{opacity:1}

.ptitle{display:none}

/* ---------- months ---------- */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
.month{border:2.5px solid var(--rule);background:var(--paper);min-width:0;break-inside:avoid}
.mtitle{height:28px;display:flex;align-items:center;justify-content:center;border-bottom:2.5px solid var(--rule)}
.mtitle h3{margin:0;font-size:14.5px;font-weight:800;white-space:nowrap}
.dow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-bottom:1px solid #b8bec7}
.dow span{font-size:10.5px;letter-spacing:.06em;text-align:center;color:var(--ink-soft);padding:1px 0}
.wk{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.day{position:relative;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);min-height:27px;min-width:0;
 display:flex;align-items:center;justify-content:center;padding:4px 0;background:var(--off);cursor:pointer;user-select:none}
.day:last-child{border-right:0}
.wk:last-child .day{border-bottom:0}
.day.work{background:var(--work)}
.day.blank{background:var(--blank);cursor:default}
.day .num{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1;color:#6b6620}
.day.work .num{color:var(--ink);font-weight:700}
.day:not(.blank):hover{box-shadow:inset 0 0 0 2.5px #2f6df6;z-index:2}
.day .hol{position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:var(--flag)}
.day.needsappr{box-shadow:inset 0 0 0 3px var(--flag)}
.day.flash{animation:fl 1.1s ease-out 2}
@keyframes fl{0%,100%{box-shadow:inset 0 0 0 3px #2f6df6}50%{box-shadow:inset 0 0 0 9px #2f6df6}}

.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;margin-top:14px;align-items:center}
.legend i{display:inline-block;width:15px;height:15px;border:1.5px solid var(--rule);vertical-align:-3px;margin-right:6px}

/* ---------- holiday & break checklist ---------- */
.checklist{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:22px;align-items:start;break-inside:avoid}
.col{display:flex;flex-direction:column;gap:15px;min-width:0}
.blk{display:flex;flex-direction:column;gap:2px}
.item{display:flex;gap:9px;align-items:flex-start;text-align:left;background:none;border:1px solid transparent;border-radius:4px;padding:3px 6px;font-size:14px;line-height:1.3;width:100%}
.item:hover{background:#eef1f5}
.item.on{background:var(--off);border-color:#c9b800}
.item.part{background:var(--off-soft);border-color:#e0d55c}
.item .bx{width:14px;height:14px;flex:none;margin-top:2px;border:1.7px solid var(--rule);background:var(--paper);display:flex;align-items:center;justify-content:center}
.item.on .bx{background:var(--rule)}
.item .bx svg{display:none;width:10px;height:10px;stroke:#fff;stroke-width:2.6;fill:none}
.item.on .bx svg{display:block}
.item.part .bx::after{content:"";width:8px;height:2.5px;background:var(--rule)}
.item.fed .lbl{font-weight:700}
.item .sub{display:block;font-weight:400;color:var(--ink-soft);font-size:13px}
.item.on .sub{color:#5c5200}

.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--rule);color:#fff;padding:10px 18px;border-radius:6px;font-size:14px;z-index:80;opacity:0;pointer-events:none;transition:opacity .18s}
.toast.on{opacity:1}

@media (max-width:1000px){.checklist{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.checklist{grid-template-columns:minmax(0,1fr)}}
@media (max-width:460px){.grid{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@page{size:letter landscape;margin:.35in}
@media print{
  body{background:#fff;font-size:11pt}
  .chrome,.no-print{display:none!important}
  .wrap{padding:0;max-width:none}
  .ptitle{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2.5px solid var(--rule);padding-bottom:5px;margin-bottom:12px}
  .ptitle h2{margin:0;font-size:15pt;font-weight:800}
  .ptitle span{font-size:10pt;font-variant-numeric:tabular-nums}
  .status{gap:4px;margin-bottom:12px}
  .msg{font-size:10pt;padding:5px 9px;max-width:none}
  .msg .go{display:none}
  .grid,.checklist{gap:8px}
  .month{border-width:2px}
  .mtitle{height:22px}
  .mtitle h3{font-size:11.5pt}
  .day{min-height:22px;padding:3px 0}
  .day .num{font-size:10pt}
  .dow span{font-size:8.5pt}
  .legend{font-size:9pt;gap:12px}
  .checklist{margin-top:14px}
  .item{font-size:9.5pt;padding:1px 4px}
  .item .sub{font-size:9pt}
  .item:hover{background:none}
  .day,.mtitle,.dow span,.month,.item,.msg{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<header class="chrome">
  <div class="chrome-in">
    <div class="brand">
      <h1>Calendar Committee</h1>
      <span class="yr">school year</span>
      <span class="ystep">
        <button id="yprev" title="Previous school year">&#9664;</button>
        <input id="yrin" type="number" step="1" inputmode="numeric" aria-label="School year start">
        <span class="end" id="yrend"></span>
        <button id="ynext" title="Next school year">&#9654;</button>
      </span>
    </div>
    <button class="btn" id="undo">Undo</button>
    <button class="btn" id="redo">Redo</button>
    <button class="btn primary" id="printBtn">Print / PDF</button>
  </div>
</header>

<div class="wrap">
  <div class="ptitle"><h2 id="ptitleText"></h2><span id="ptitleTally"></span></div>
  <div class="status" id="status"></div>
  <div class="grid" id="grid"></div>

  <div class="legend">
    <span><i style="background:#a8bedd"></i>Work day</span>
    <span><i style="background:#fff34d"></i>Off</span>
    <span><i style="background:#d3d6db"></i>Not a weekday of this month</span>
    <span><i style="background:#fff;box-shadow:inset 0 0 0 3px #b3261e"></i>Work day, approval required</span>
    <span><i style="background:#fff;position:relative"><b style="display:block;width:7px;height:7px;border-radius:50%;background:#b3261e;margin:1px 0 0 5px"></b></i>Federal holiday</span>
  </div>

  <div class="checklist" id="checklist"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================ date helpers ============================ */
const MN=["January","February","March","April","May","June","July","August","September","October","November","December"];
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const mk=(y,m,d)=>new Date(y,m,d);
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const isWeekday=d=>d.getDay()>=1&&d.getDay()<=5;
const fmt=d=>`${MN[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
const fmtShort=d=>`${MN[d.getMonth()].slice(0,3)} ${d.getDate()}`;
function nthDow(y,m,dow,n){const f=mk(y,m,1);return mk(y,m,1+((dow-f.getDay()+7)%7)+(n-1)*7);}
function lastDow(y,m,dow){const l=mk(y,m+1,0);return mk(y,m,l.getDate()-((l.getDay()-dow+7)%7));}
function observed(d){if(d.getDay()===6)return addDays(d,-1);if(d.getDay()===0)return addDays(d,1);return d;}
function weekOf(d){const mon=addDays(d,-((d.getDay()+6)%7));return [0,1,2,3,4].map(i=>addDays(mon,i));}
function fridayBefore(mon){return addDays(mon,-3);}

/* ============================ rules ============================ */
const TARGET=182,MIN_PER_MONTH=8;
function months(y0){const out=[];for(let i=0;i<12;i++)out.push({y:i<5?y0:y0+1,m:(7+i)%12});return out;}

function fed(y0){
  const y1=y0+1;
  const raw=[
    ["Labor Day",nthDow(y0,8,1,1)],
    ["Columbus Day / Indigenous Peoples' Day",nthDow(y0,9,1,2)],
    ["Veterans Day",mk(y0,10,11)],
    ["Thanksgiving Day",nthDow(y0,10,4,4)],
    ["Christmas Day",mk(y0,11,25)],
    ["New Year's Day",mk(y1,0,1)],
    ["Martin Luther King Jr. Day",nthDow(y1,0,1,3)],
    ["Presidents' Day",nthDow(y1,1,1,3)],
    ["Memorial Day",lastDow(y1,4,1)],
    ["Juneteenth",mk(y1,5,19)],
    ["Independence Day",mk(y1,6,4)]
  ];
  return raw.map(([name,d])=>{const o=observed(d);return {name,date:o,shifted:iso(o)!==iso(d)};});
}
const christmasWeek=y=>weekOf(observed(mk(y,11,25)));
const newYearWeek=y=>weekOf(observed(mk(y+1,0,1)));
const springWeek=y=>weekOf(nthDow(y+1,3,1,1));
const midWinterWeek=y=>weekOf(nthDow(y+1,1,1,3));
const laborWeek=y=>weekOf(nthDow(y,8,1,1));
const thx=y=>{const t=nthDow(y,10,4,4);return {wed:addDays(t,-1),thu:t,fri:addDays(t,1)};};
function julyFridays(y0){const out=[],last=mk(y0+1,7,0).getDate();for(let d=1;d<=last;d++){const dt=mk(y0+1,6,d);if(dt.getDay()===5)out.push(dt);}return out;}

function approvalReason(dt){
  if(dt.getMonth()===6&&dt.getDay()===5)return "july";
  if(iso(dt)===iso(thx(YR).wed))return "thx";
  return null;
}

/* ============================ checklist definition ============================ */
const COLUMNS=[
  [ [{id:"allfed",label:"All federal holidays",fed:true,all:true}],
    [{id:"labor",label:"Labor Day",fed:true,days:y=>[nthDow(y,8,1,1)]},
     {id:"laborweek",label:"Labor Day week",days:y=>laborWeek(y)}],
    [{id:"columbus",label:"Columbus Day / Indigenous Peoples' Day",fed:true,days:y=>[observed(nthDow(y,9,1,2))]}] ],

  [ [{id:"veterans",label:"Veterans Day",fed:true,days:y=>[observed(mk(y,10,11))]}],
    [{id:"thxwed",label:"Wednesday before",sub:"approval required to work",days:y=>[thx(y).wed]},
     {id:"thxday",label:"Thanksgiving Day",fed:true,days:y=>[thx(y).thu]},
     {id:"thxfri",label:"Friday after",days:y=>[thx(y).fri]}],
    [{id:"xmas",label:"Christmas Day",fed:true,days:y=>[observed(mk(y,11,25))]},
     {id:"xmasweek",label:"Christmas week",days:y=>christmasWeek(y)},
     {id:"xmasfri",label:"Friday before",days:y=>[fridayBefore(christmasWeek(y)[0])]}],
    [{id:"nyd",label:"New Year's Day",fed:true,days:y=>[observed(mk(y+1,0,1))]},
     {id:"nydweek",label:"New Year's week",days:y=>newYearWeek(y)}],
    [{id:"mlk",label:"Martin Luther King Jr. Day",fed:true,days:y=>[nthDow(y+1,0,1,3)]}] ],

  [ [{id:"pres",label:"Presidents' Day",fed:true,days:y=>[nthDow(y+1,1,1,3)]},
     {id:"midwinter",label:"Mid-winter break",sub:"Presidents' Day week",days:y=>midWinterWeek(y)}],
    [{id:"springfri",label:"Friday before",days:y=>[fridayBefore(springWeek(y)[0])]},
     {id:"springweek",label:"First full week of April",days:y=>springWeek(y)}] ],

  [ [{id:"memorial",label:"Memorial Day",fed:true,days:y=>[lastDow(y+1,4,1)]},
     {id:"juneteenth",label:"Juneteenth",fed:true,days:y=>[observed(mk(y+1,5,19))]},
     {id:"july4",label:"Independence Day",fed:true,days:y=>[observed(mk(y+1,6,4))]}],
    [{id:"julyfri",label:"Fridays in July",sub:"admin building closed",days:y=>julyFridays(y)}] ]
];
const ITEMS={};COLUMNS.flat(2).forEach(i=>ITEMS[i.id]=i);
function itemDays(item){
  const list=item.all?fed(YR).map(h=>h.date):item.days(YR);
  return list.map(iso).filter(k=>k in days);
}
function itemState(item){
  const l=itemDays(item);if(!l.length)return "off";
  const n=l.filter(k=>days[k]==="off").length;
  return n===l.length?"on":(n?"part":"off");
}

/* ============================ state ============================ */
let YR=2026,days={},undoStack=[],redoStack=[],HOL={};

function allDays(y0){const out=[];for(const {y,m} of months(y0)){const last=mk(y,m+1,0).getDate();for(let d=1;d<=last;d++){const dt=mk(y,m,d);if(isWeekday(dt))out.push(dt);}}return out;}
function initYear(y0){
  YR=y0;HOL={};
  fed(y0).forEach(h=>HOL[iso(h.date)]=h);
  days={};
  allDays(y0).forEach(d=>days[iso(d)]="work");
  ["allfed","thxwed","thxday","thxfri","xmasweek","xmasfri","nydweek","springfri","springweek","julyfri"]
    .forEach(id=>setDays(itemDays(ITEMS[id]),"off"));
  undoStack=[];redoStack=[];
}
function setDays(keys,v){keys.forEach(k=>{if(k in days)days[k]=v;});}
function snapshot(){undoStack.push(JSON.stringify(days));if(undoStack.length>80)undoStack.shift();redoStack=[];}

/* ============================ validation ============================ */
function tally(){
  const per={},t={total:0,short:[],julyWork:[],thxWork:null};
  months(YR).forEach(({y,m})=>per[`${y}-${m}`]=0);
  Object.keys(days).forEach(k=>{
    if(days[k]!=="work")return;
    const [Y,M,D]=k.split("-").map(Number),dt=mk(Y,M-1,D);
    t.total++;per[`${Y}-${M-1}`]++;
    const r=approvalReason(dt);
    if(r==="july")t.julyWork.push(dt);
    if(r==="thx")t.thxWork=dt;
  });
  months(YR).forEach(({y,m})=>{if(per[`${y}-${m}`]<MIN_PER_MONTH)t.short.push({y,m,n:per[`${y}-${m}`]});});
  t.per=per;return t;
}

/* ============================ render ============================ */
function monthRows(y,m){
  const rows=[],last=mk(y,m+1,0).getDate();let cur=null;
  for(let d=1;d<=last;d++){
    const dt=mk(y,m,d);if(!isWeekday(dt))continue;
    const wid=iso(addDays(dt,-(dt.getDay()-1)));
    if(!cur||cur.wid!==wid){cur={wid,cells:[null,null,null,null,null]};rows.push(cur);}
    cur.cells[dt.getDay()-1]=dt;
  }
  return rows;
}
const CHECK='<svg viewBox="0 0 12 12"><polyline points="2,6.4 4.6,9 10,3"/></svg>';

function render(){
  const t=tally(),ms=months(YR);
  // visual layout is column-major (Aug/Sep/Oct down column 1), emitted row by row
  const order=[];
  for(let r=0;r<3;r++)for(let c=0;c<4;c++)order.push(ms[c*3+r]);
  document.getElementById("grid").innerHTML=order.map(({y,m})=>monthCard(y,m)).join("");

  const d=t.total-TARGET;
  document.getElementById("ptitleText").textContent=`${YR}\u2013${String(YR+1).slice(2)} School Year Calendar`;
  document.getElementById("ptitleTally").textContent=`${t.total} work days scheduled \u00b7 target ${TARGET}`;

  renderStatus(t);renderChecklist();
  try{if(window.storage)window.storage.set("cal:"+YR,JSON.stringify(days));}catch(e){}
  document.getElementById("undo").disabled=!undoStack.length;
  document.getElementById("redo").disabled=!redoStack.length;
}

function monthCard(y,m){
  let h=`<div class="month"><div class="mtitle"><h3>${MN[m]} ${y}</h3></div>
    <div class="dow"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span></div>`;
  monthRows(y,m).forEach(r=>{
    h+=`<div class="wk">`;
    r.cells.forEach(dt=>{
      if(!dt){h+=`<div class="day blank"></div>`;return;}
      const k=iso(dt),st=days[k],hol=HOL[k],reason=approvalReason(dt);
      let cls="day "+(st==="work"?"work":"off");
      if(st==="work"&&reason)cls+=" needsappr";
      const title=[fmt(dt),hol?"Federal holiday: "+hol.name:"",
        st==="work"&&reason==="july"?"Admin building closed on Fridays in July":"",
        st==="work"&&reason==="thx"?"Wednesday of Thanksgiving break":""].filter(Boolean).join(" \u2014 ");
      h+=`<div class="${cls}" id="d${k}" data-k="${k}" title="${title}"><span class="num">${dt.getDate()}</span>${hol?'<span class="hol"></span>':""}</div>`;
    });
    h+=`</div>`;
  });
  return h+`</div>`;
}

function renderStatus(t){
  const out=[],d=t.total-TARGET;
  const line=(kind,ic,text,jump)=>out.push(`<div class="msg ${kind}"><span class="ic">${ic}</span><span>${text}</span>${jump?`<button class="go no-print" data-jump="${jump}">Show me</button>`:""}</div>`);

  if(d===0)line("ok","\u2713",`<b>182</b> work days scheduled. On target.`);
  else if(d>0)line("bad","\u2716",`<b>${d}</b> day${d>1?"s":""} over target \u2014 turn <b>${d}</b> work day${d>1?"s":""} off. Currently <b>${t.total}</b> of 182.`);
  else line("bad","\u2716",`<b>${-d}</b> day${d<-1?"s":""} under target \u2014 add <b>${-d}</b> work day${d<-1?"s":""} back. Currently <b>${t.total}</b> of 182.`);

  if(!t.short.length)line("ok","\u2713","Every month has at least 8 work days.");
  else t.short.forEach(s=>line("bad","\u2716",`<b>${MN[s.m]} ${s.y}</b> has ${s.n} work day${s.n===1?"":"s"}, fewer than the 8 required.`,`${s.y}-${pad(s.m+1)}-01`));

  t.julyWork.forEach(dt=>line("bad","\u2716",`<b>${fmt(dt)}</b> is a work day, even though the admin building is closed on Fridays in July.`,iso(dt)));
  if(t.thxWork)line("bad","\u2716",`<b>${fmt(t.thxWork)}</b>, the Wednesday of Thanksgiving break, is a work day. This is not recommended.`,iso(t.thxWork));

  document.getElementById("status").innerHTML=out.join("");
}

function renderChecklist(){
  document.getElementById("checklist").innerHTML=COLUMNS.map(col=>
    `<div class="col">`+col.map(blk=>
      `<div class="blk">`+blk.map(item=>{
        const st=itemState(item),ds=itemDays(item);
        const tip=ds.length?ds.map(k=>{const [Y,M,D]=k.split("-").map(Number);return fmtShort(mk(Y,M-1,D));}).join(", "):"no dates in this school year";
        return `<button class="item ${st==="on"?"on":st==="part"?"part":""} ${item.fed?"fed":""}" data-item="${item.id}" title="${tip}">
          <span class="bx">${CHECK}</span>
          <span class="lbl">${item.label}${item.sub?`<span class="sub">${item.sub}</span>`:""}</span></button>`;
      }).join("")+`</div>`).join("")+`</div>`).join("");
}

/* ============================ interaction ============================ */
let painting=false,paintTo=null;
const grid=document.getElementById("grid");
function paint(cell){
  if(!cell||cell.classList.contains("blank"))return;
  const k=cell.dataset.k;
  if(days[k]===paintTo)return;
  days[k]=paintTo;
  cell.classList.toggle("work",paintTo==="work");
  cell.classList.toggle("off",paintTo==="off");
  const [Y,M,D]=k.split("-").map(Number);
  cell.classList.toggle("needsappr",paintTo==="work"&&!!approvalReason(mk(Y,M-1,D)));
}
grid.addEventListener("mousedown",e=>{
  const cell=e.target.closest(".day");
  if(!cell||cell.classList.contains("blank"))return;
  e.preventDefault();snapshot();
  paintTo=days[cell.dataset.k]==="work"?"off":"work";
  painting=true;paint(cell);
});
grid.addEventListener("mouseover",e=>{if(painting)paint(e.target.closest(".day"));});
document.addEventListener("mouseup",()=>{if(painting){painting=false;render();}});

document.getElementById("checklist").addEventListener("click",e=>{
  const b=e.target.closest("[data-item]");if(!b)return;
  const item=ITEMS[b.dataset.item],keys=itemDays(item);
  if(!keys.length){toast("Those dates fall outside this school year");return;}
  snapshot();
  setDays(keys,itemState(item)==="on"?"work":"off");
  render();
});
document.getElementById("status").addEventListener("click",e=>{
  const j=e.target.closest("[data-jump]");if(!j)return;
  const el=document.getElementById("d"+j.dataset.jump)||document.querySelector(`[id^="d${j.dataset.jump.slice(0,7)}"]`);
  if(el){el.scrollIntoView({block:"center",behavior:"smooth"});el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),2400);}
});

const yrin=document.getElementById("yrin"),yrend=document.getElementById("yrend");
async function openYear(y){
  if(!Number.isFinite(y))return;
  initYear(y);
  try{if(window.storage){const r=await window.storage.get("cal:"+y);if(r)days=JSON.parse(r.value);}}catch(e){}
  yrin.value=y;yrend.textContent="\u2013"+String(y+1).slice(2);
  render();toast(`Opened ${y}\u2013${String(y+1).slice(2)}`);
}
document.getElementById("yprev").onclick=()=>openYear(YR-1);
document.getElementById("ynext").onclick=()=>openYear(YR+1);
yrin.addEventListener("change",()=>{const y=parseInt(yrin.value,10);Number.isFinite(y)?openYear(y):(yrin.value=YR);});
yrin.addEventListener("keydown",e=>{if(e.key==="Enter")yrin.blur();});
document.getElementById("undo").onclick=()=>{if(!undoStack.length)return;redoStack.push(JSON.stringify(days));days=JSON.parse(undoStack.pop());render();};
document.getElementById("redo").onclick=()=>{if(!redoStack.length)return;undoStack.push(JSON.stringify(days));days=JSON.parse(redoStack.pop());render();};
document.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){e.preventDefault();e.shiftKey?document.getElementById("redo").click():document.getElementById("undo").click();}
});
document.getElementById("printBtn").onclick=()=>window.print();

let tid;function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");clearTimeout(tid);tid=setTimeout(()=>t.classList.remove("on"),2600);}

(async function(){
  initYear(YR);
  try{if(window.storage){const r=await window.storage.get("cal:"+YR);if(r)days=JSON.parse(r.value);}}catch(e){}
  yrin.value=YR;yrend.textContent="\u2013"+String(YR+1).slice(2);
  render();
})();
</script>
